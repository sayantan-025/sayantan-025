name: Refresh animated profile cards
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/render_profile.py"
      - "data/profile.json"
      - ".github/workflows/refresh-profile-cards.yml"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install font subsetting tools
        run: |
          python -m pip install --upgrade pip fonttools brotli cairosvg
      - name: Render SVG cards and refresh contribution data
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python scripts/render_profile.py
      - name: Commit generated cards and refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/ data/profile.json
          git diff --cached --quiet || git commit -m "chore: refresh animated profile cards"
          git push
